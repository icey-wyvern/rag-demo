services:
  integration-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag_test
      POSTGRES_PASSWORD: rag_test_password
      POSTGRES_DB: rag_integration_test
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_test -d rag_integration_test"]
      interval: 2s
      timeout: 3s
      retries: 30
